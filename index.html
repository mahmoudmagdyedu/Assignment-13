<!DOCTYPE html>
<html>
<head>
    <title>Kanban</title>
    <link rel="stylesheet" href="assets/css/output.css">
    <link rel="stylesheet" href="assets/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F2F6FA] font-[Inter] min-h-screen flex flex-col justify-between">
    <div class="bg-black/40 w-full h-screen fixed top-0 left-0 z-50 flex justify-center items-center p-4 hidden" id="pop">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl">
            <div class="flex justify-between items-center pb-3 border-b border-gray-100 mb-4">
                <p class="text-xl font-semibold text-black">Create New Task</p>
                <button id="exit" class="text-gray-400 hover:text-black cursor-pointer">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold text-[#62748E] mb-1">
                    <i class="fa-solid fa-heading me-1 text-gray-400"></i> Task Title <span class="text-red-500">*</span>
                </label>
                <input type="text" placeholder="What needs to be done?" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:outline-none">
                <p id="title-error" class="text-red-500 text-xs mt-1 hidden">Task title is required</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-sm font-semibold text-[#62748E] mb-1">
                        <i class="fa-solid fa-flag me-1 text-gray-400"></i> Priority
                    </label>
                    <div class="relative">
                        <select id="preyorty" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm appearance-none focus:outline-none bg-white cursor-pointer">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-xs text-gray-400 pointer-events-none"></i>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-[#62748E] mb-1">
                        <i class="fa-regular fa-calendar me-1 text-gray-400"></i> Due Date
                    </label>
                    <input type="date" id="date" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm text-gray-500 focus:outline-none cursor-pointer">
                    <p id="date-error" class="text-red-500 text-xs mt-1 hidden">Due date cannot be in the past</p>
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold text-[#62748E] mb-1">
                    <i class="fa-solid fa-bars-staggered me-1 text-gray-400"></i> Description
                </label>
                <textarea rows="3" maxlength="500" placeholder="Add more details about this task..." class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:outline-none resize-none"></textarea>
                <p id="char-count" class="text-right text-[12px] text-[#A3B1C5]">0/500</p>
            </div>

            <div class="flex gap-3">
                <button id="cancel-btn" class="w-1/2 bg-[#F2F6FA] hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-xl cursor-pointer">Cancel</button>
                <button id="sub-btn" class="w-1/2 bg-[#5738F7] hover:opacity-90 text-white font-semibold py-2.5 rounded-xl cursor-pointer flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus text-xs"></i> Add Task
                </button>
            </div>
        </div>
    </div>

    <nav class="bg-linear-to-r from-[#5738F7] to-[#9711FA] w-full flex justify-center sticky top-0 z-40 shadow-sm">
        <div class="w-full flex justify-between p-3 items-center max-w-7xl px-5">
            <div class="flex items-center">
                <i class="fa-solid fa-table-columns text-2xl text-white me-2"></i>
                <span class="text-2xl font-bold text-white">Kanban</span>
            </div>
            <div class="bg-white/20 hover:bg-white/30 h-10 w-10 p-2 rounded-lg flex items-center justify-center transition-colors">
                <button class="text-lg text-white cursor-pointer" id="add-btn"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
        <aside class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="min-h-125 bg-white rounded-2xl border border-gray-200 relative flex flex-col p-2">
                <div class="p-3 flex gap-3 items-center border-b border-gray-100">
                    <div class="text-[#62748E] p-2 rounded-xl w-10 h-10 bg-gray-100 flex items-center justify-center">
                        <i class="fa-solid fa-clipboard-list text-slate-500 text-lg"></i>
                    </div>
                    <div>
                        <p class="font-bold text-[#1D293D]">To Do</p>
                        <p id="todo-count" class="text-[#A3B1C5] text-[12px]">0 tasks</p>
                    </div>
                </div>
                <div id="card-to-do" class="flex-1 overflow-y-auto"></div>
                <div id="no-file" class="flex flex-col items-center justify-center py-16 text-[#90a1b9]">
                    <i class="fa-regular fa-folder-open text-4xl mb-3 opacity-50"></i>
                    <p class="text-sm">No tasks yet</p>
                    <p class="text-[12px]">Click + to add one</p>
                </div>
            </div>

            <div class="min-h-125 bg-white rounded-2xl border border-gray-200 relative flex flex-col p-2">
                <div class="p-3 flex gap-3 items-center border-b border-gray-100">
                    <div class="text-[#62748E] p-2 rounded-xl w-10 h-10 bg-amber-50 flex items-center justify-center">
                        <i class="fa-solid fa-spinner text-amber-500 text-lg"></i>
                    </div>
                    <div>
                        <p class="font-bold text-[#1D293D]">In Progress</p>
                        <p id="pro-count" class="text-[#A3B1C5] text-[12px]">0 tasks</p>
                    </div>
                </div>
                <div id="pro-card" class="flex-1 overflow-y-auto"></div>
                <div id="no-file-progress" class="flex flex-col items-center justify-center py-16 text-[#90a1b9]">
                    <i class="fa-regular fa-folder-open text-4xl mb-3 opacity-50"></i>
                    <p class="text-sm">No tasks yet</p>
                    <p class="text-[12px]">Click + to add one</p>
                </div>
            </div>

            <div class="min-h-125 bg-white rounded-2xl border border-gray-200 relative flex flex-col p-2">
                <div class="p-3 flex gap-3 items-center border-b border-gray-100">
                    <div class="text-[#62748E] p-2 rounded-xl w-10 h-10 bg-emerald-50 flex items-center justify-center">
                        <i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i>
                    </div>
                    <div>
                        <p class="font-bold text-[#1D293D]">Completed</p>
                        <p id="comp-count" class="text-[#A3B1C5] text-[12px]">0 tasks</p>
                    </div>
                </div>
                <div id="comp-card" class="flex-1 overflow-y-auto"></div>
                <div id="no-file-completed" class="flex flex-col items-center justify-center py-16 text-[#90a1b9]">
                    <i class="fa-regular fa-folder-open text-4xl mb-3 opacity-50"></i>
                    <p class="text-sm">No tasks yet</p>
                    <p class="text-[12px]">Click + to add one</p>
                </div>
            </div>
        </aside>
    </main>

    <footer class="bg-linear-to-r from-slate-800 to-slate-900 w-full py-4 mt-8">
        <p class="text-white text-center text-sm">Made with by <i class="fa-solid fa-heart text-rose-500 animate-pulse"></i> Route Academy</p>
    </footer>

    <script src="assets/js/all.min.js"></script>
    <script src="assets/ts/main.js"></script>
</body>
</html>
